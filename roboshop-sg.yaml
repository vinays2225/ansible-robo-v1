    #     vpc_id: "{{item.vpc_id}}"
    #     region: "us-east-1"
    #     rules:
    #       - proto: tcp
    #         ports:
    #           - 22  
    #         group_name: "{{item.}}"
    #         rule_desc: "Allow "
    #   loop: "{{ all_sg_group_out.security_groups }}" 



    - name: "Delete group by its id"
      amazon.aws.ec2_security_group:
        group_id: "{{ app_name }}-{{item}}"
        state: absent
      loop: "{{ sg_group_names  }}"
      when: sg_action == "delete"  




