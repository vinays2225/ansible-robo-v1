- name: Configure cart service
  hosts: cart
  become: yes
  tasks:
    - name: Disable default node js
      command: dnf module disable nodejs -y

    - name: Enable nodejs 24
      command: dnf module enable nodejs:24 -y

    - name: install Nodejs
      dnf:
        name: nodejs
        status: present 

    - name: create system user
      user:
        name: roboshop
        system: yes
        create_home: no
        home: /app
        shell: /sbin/nologin
        comment: "roboshop system user"  

    - name: Remove app dir
      file:
        path: /app
        state: absent 

    - name: Remove old code dir
      file:
        path: /tmp/cart.zip
        state: absent   

    - name: create app dir
      file:
        path: /app
        state: directory

    - name: Download code
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/cart-v4.zip
        dest: /tmp/cart.zip 

    - name: Unzip code
      unarchive:
        src: /tmp/cart.zip
        dest: /app 
        remote_src: yes #. if no ansible checking in his server location

    - name: Install dependencies
      community.general.npm:
        path: /app 

    - name: Copy cart service
      copy:
        src: cart.service.j2
        dest: /etc/systemd/system/cart.service   

  
    - name: Demon reload service
      systemd_service:
        daemon_reload: true

    - name: start and enable service
      service:
        name: cart
        status: restarted
        enabled: yes    
