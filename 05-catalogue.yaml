- name: Configure Catalogue service
  hosts: catalogue
  become: yes
  tasks:
    - name: Disable default node js
      command: dnf module disable nodejs -y

    - name: Enable nodejs 24
      command: dnf module enable nodejs:24 -y

    - name: install Nodejs
      dnf:
        name: nodejs
        status: prasent 

    - name: create system user
      user:
        name: roboshop
        system: yes
        create_home: no
        home: /app
        shell: /sbin/nologin
        comment: "roboshop system user"  

    - name: Remove app dir
      file:
        path: /app
        state: absent 

    - name: Remove old code dir
      file:
        path: /tmp/catalogue.zip
        state: absent   

    - name: create app dir
      file:
        path: /app
        state: directory

    - name: Download code
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
        dest: /tmp/catalogue.zip 

    - name: Unzip code
      unarchive:
        src: /tmp/catalogue.zip
        dest: /app 
        remote_src: yes #. if no ansible checking in his server location

    - name: Install dependencies
      community.general.npm:
        path: /app 

    - name: Copy catalogue service
      copy:
        src: catalogue.service.j2
        dest: /etc/systemd/system/catalogue.service   

    - name: Copy mongo repo
      copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo  

    - name: install mongodb client
      dnf:
        name: mongodb-mongosh
        state: prasent

    - name: Check product count
      command:  mongosh --host "{{mongodb_host}}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'      
      register: product_count

    - name: locad products
      shell: mongosh --host "{{ mongodb_host }}" < /app/db/master-data.js
      when: product_count.stdout | int != 0

    - name: Demon reload service
      systemd_service:
        daemon_reload: true

    - name: start and enable service
      service:
        name: catalogue
        status: restarted
        enabled: yes    
