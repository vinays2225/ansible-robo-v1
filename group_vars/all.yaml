mysql_port: 3306
redis_port: 6379
mongodb_port: 27017
rabbitmq_port: 5672
rabbitmq_admin_port: 15672
catalogue_port: 8080
user_port: 8080
cart_port: 8080
shipping_port: 8080
payment_port:  8080
dispatch_port: 8080
frontend_port: 80

sg_components:
- { name: "mysql", port: 3306, inbound: "roboshop-shipping" }
- { name: "mongodb", port: 27017, inbound: "roboshop-user" }
- { name: "mongodb", port: 27017, inbound: "roboshop-catalogue"}
- { name: "rabbitmq", port: 5672, inbound: "roboshop-payment" }
- { name: "rabbitmq", port: 5672, inbound: "roboshop-dispatch" }
- { name: "rabbitmq", port: 15672, inbound: "My-IP" }
- { name: "redis", port: 6379, inbound: "roboshop-user" }
- { name: "redis", port: 6379, inbound: "roboshop-cart" }
- { name: "catalogue", port: 8080, inbound: "roboshop-frontend"}
- { name: "catalogue", port: 8080, inbound: "roboshop-cart" }
- { name: "user", port: 8080, inbound: "roboshop-frontend" }
- { name: "user", port: 8080, inbound: "roboshop-payment" }
- { name: "cart", port: 8080, inbound: "roboshop-frontend" }
- { name: "cart", port: 8080, inbound: "roboshop-payment" }
- { name: "cart", port: 8080, inbound: "roboshop-shipping"}
- { name: "shipping", port: 8080, inbound: "roboshop-frontend" }
- { name: "payment", port: 8080, inbound: "roboshop-frontend" }
- { name: "frontend", port: 80, inbound: "0.0.0.0/0" }
