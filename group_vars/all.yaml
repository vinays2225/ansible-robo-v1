mysql_port: 3306
redis_port: 6379
mongodb_port: 27017
rabbitmq_port: 5672
rabbitmq_admin_port: 15672
catalogue_port: 8080
user_port: 8080
cart_port: 8080
shipping_port: 8080
payment_port:  8080
dispatch_port: 8080
frontend_port: 80

sg_components:
- name: "mysql"
  inbound_rules:
    - { name: "mysql", port: 3306, inbound: "shipping" }
- name: "mymongodbsql"
  inbound_rules:    
    - { name: "mongodb", port: 27017, inbound: "user" }
    - { name: "mongodb", port: 27017, inbound: "catalogue"}
- name: "rabbitmq"
  inbound_rules:    
    - { name: "rabbitmq", port: 5672, inbound: "payment" }
    - { name: "rabbitmq", port: 5672, inbound: "dispatch" }
    - { name: "rabbitmq", port: 15672, inbound: "My-IP" }
- name: "redis"
  inbound_rules:    
    - { name: "redis", port: 6379, inbound: "user" }
    - { name: "redis", port: 6379, inbound: "cart" }
- name: "catalogue"
  inbound_rules:
    - { name: "catalogue", port: 8080, inbound: "frontend"}
    - { name: "catalogue", port: 8080, inbound: "cart" }
- name: "user"
  inbound_rules:    
    - { name: "user", port: 8080, inbound: "frontend" }
    - { name: "user", port: 8080, inbound: "payment" }
- name: "cart"
  inbound_rules:    
    - { name: "cart", port: 8080, inbound: "frontend" }
    - { name: "cart", port: 8080, inbound: "payment" }
    - { name: "cart", port: 8080, inbound: "shipping"}
- name: "shipping"
  inbound_rules:
    - { name: "shipping", port: 8080, inbound: "frontend" }
- name: "payment"
  inbound_rules:
    - { name: "payment", port: 8080, inbound: "frontend" }
#- { name: "frontend", port: 80, inbound: "0.0.0.0/0" }
