- name: Configure payment service
  hosts: payment
  become: yes
  tasks:
    - name: install python
      dnf:
        name:
        - python3.14
        - python3.14-pip
        state: prasent

    - name: Create system user
      user:
        name: roboshop
        system: yes
        create_home: false
        home: /app
        shell: /sbin/nologin
        comment: "roboshop system user" 

    - name: Remove app dir
      file:
        path: /app
        state: absent 

    - name: Remove old code dir
      file:
        path: /tmp/payment.zip
        state: absent   

    - name: create app dir
      file:
        path: /app
        state: directory

    - name: Download code
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/payment-v4.zip
        dest: /tmp/payment.zip 

    - name: Unzip code
      unarchive:
        src: /tmp/payment.zip
        dest: /app 
        remote_src: yes #. if no ansible checking in his server location

    - name: install dependencies
      pip:
        requirements: /app/requirements.txt
        virtualenv: /app/.venv
        virtualenv_command: python3.14 -m venv

    - name: Copy payment service
      copy:
        src: payment.service.j2
        dest: /etc/systemd/system/payment.service   

  
    - name: Demon reload service
      systemd_service:
        daemon_reload: true

    - name: start and enable service
      service:
        name: payment
        status: restarted
        enabled: yes    
       
        